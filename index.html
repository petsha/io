<style>
:root{
  --bg:#F3F1EC; --bg-alt:#E7E3D9; --panel:#FFFFFF; --ink:#1B1E20; --ink-dim:#5B6266;
  --line:#D9D4C8; --accent:#C97A2B; --accent-ink:#FFFFFF; --good:#2E7D4F; --bad:#B3452F;
  --radius:10px; --sans:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --bg-alt:#1D2023; --panel:#1F2226; --ink:#EDEAE2; --ink-dim:#9BA1A5;
    --line:#33373B; --accent:#E0913C; --accent-ink:#151719; --good:#4FAF77; --bad:#E06A4E;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --bg-alt:#1D2023; --panel:#1F2226; --ink:#EDEAE2; --ink-dim:#9BA1A5;
  --line:#33373B; --accent:#E0913C; --accent-ink:#151719; --good:#4FAF77; --bad:#E06A4E;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100%;}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0 0 4px;}
.mono{font-family:var(--mono);}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
button{cursor:pointer;}
a{color:var(--accent);}

/* layout */
#app{display:flex;min-height:100vh;}
nav#side{width:210px;flex:0 0 210px;background:var(--bg-alt);border-right:1px solid var(--line);
  padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));position:sticky;top:0;height:100vh;overflow-y:auto;}
nav#side .brand{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;}
nav#side .brand b{display:block;font-size:17px;}
nav#side .brand span{color:var(--ink-dim);font-size:12px;}
nav#side button.tab{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
  padding:10px 10px;border-radius:8px;color:var(--ink-dim);font-size:14px;margin-bottom:2px;}
nav#side button.tab:hover{background:var(--panel);color:var(--ink);}
nav#side button.tab.active{background:var(--accent);color:var(--accent-ink);}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1100px;}
header.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.themebtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink-dim);}

/* mobile */
#mobiletop{display:none;}
@media (max-width:820px){
  nav#side{display:none;}
  #mobiletop{display:flex;position:sticky;top:0;z-index:5;background:var(--bg-alt);border-bottom:1px solid var(--line);
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:6px;overflow-x:auto;}
  #mobiletop button{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--ink-dim);font-size:13px;}
  #mobiletop button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  main{padding:16px 14px 50px;}
}

/* cards / tables */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.grid{display:grid;gap:12px;}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.stat .num{font-family:var(--mono);font-size:24px;font-weight:700;}
.stat .lbl{color:var(--ink-dim);font-size:12px;margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
.tablewrap{overflow-x:auto;max-width:100%;}
th{text-align:left;color:var(--ink-dim);font-weight:500;font-size:12px;text-transform:none;border-bottom:1px solid var(--line);padding:8px 8px;white-space:nowrap;}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;}
.badge.paid{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good);}
.badge.unpaid{background:color-mix(in srgb, var(--bad) 18%, transparent);color:var(--bad);}
.rowbtn{background:none;border:none;color:var(--ink-dim);padding:8px 10px;border-radius:6px;font-size:16px;}
.rowbtn:hover{background:var(--bg-alt);color:var(--ink);}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--bg-alt);}

/* forms */
label{display:block;font-size:12px;color:var(--ink-dim);margin:0 0 4px;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
.form-grid.wide{grid-template-columns:1fr;}
.field{margin-bottom:2px;}
.itemsrow{display:grid;grid-template-columns:1.8fr 1.4fr 1.8fr 80px 60px 90px 32px;gap:6px;margin-bottom:6px;align-items:end;}
@media (max-width:600px){.form-grid{grid-template-columns:1fr;} .itemsrow{grid-template-columns:1fr 1fr;}}
.itemphotos{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px;}
.phwrap{position:relative;display:inline-block;}
.phwrap img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;display:block;}
.phwrap .phrm{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;padding:0;}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60;padding:20px;}
#lightbox img{max-width:92vw;max-height:80vh;border-radius:8px;}
#lightbox button{margin-top:14px;}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500;}
.btn.small{padding:6px 10px;font-size:13px;}
.btn.danger{background:var(--bad);color:#fff;}
.searchbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.searchbar input{flex:1;min-width:160px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.empty{color:var(--ink-dim);padding:20px 4px;text-align:center;font-size:14px;}
.total-line{display:flex;justify-content:flex-end;gap:20px;padding-top:10px;font-family:var(--mono);}
.total-line b{font-size:18px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:30px 14px;overflow-y:auto;z-index:50;}
.modal{background:var(--panel);border-radius:12px;padding:20px;max-width:640px;width:100%;border:1px solid var(--line);}
.modal h2{margin-bottom:14px;}
.closeX{float:right;background:none;border:none;color:var(--ink-dim);font-size:18px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:20px;font-size:13px;z-index:100;bottom:calc(20px + env(safe-area-inset-bottom,0px));}

/* printable receipt */
#printarea{display:none;}
@media print{
  html,body{height:auto !important;min-height:0 !important;overflow:visible !important;}
  #app,#mobiletop,#modalroot,#lightbox,.toast{display:none !important;}
  #printarea{display:block;position:static;width:100%;padding:0;color:#000;background:#fff;}
  .pr-head{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px;}
  .pr-head h2{margin:0;}
  .pr-table{width:100%;border-collapse:collapse;margin:10px 0;}
  .pr-table th,.pr-table td{border:1px solid #999;padding:6px;font-size:13px;text-align:left;}
  .pr-total{text-align:right;font-size:16px;font-weight:700;margin-top:6px;}
  .pr-terms{font-size:11px;color:#333;margin-top:16px;line-height:1.5;}
  .pr-photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .pr-photos figure{margin:0;}
  .pr-photos img{width:150px;height:150px;object-fit:cover;border:1px solid #999;}
  .pr-photos figcaption{font-size:11px;color:#333;margin-top:2px;}
}
</style>
</head>
<body>
<div id="mobiletop"></div>
<div id="app">
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="printarea"></div>
<div id="modalroot"></div>
<div id="lightbox"></div>

<script>
/* ---------- storage ---------- */
const KEY='kieltec_workshop_v1';
function defaultState(){
  return {
    settings:{
      name:'Kieltec', reg:'2016/388203/57',
      addr:['St Georges Street / St Georges Mall','Thibault Square Pavilion Shop 10','Cape Town City Centre 8001'],
      phone:'072 025 8865', website:'www.kieltec.co.za', email:'info@kieltec.co.za',
      bankName:'FNB', accType:'Gold Business Account', accNo:'', branchCode:'250655',
      consultFee:150, warrantyText:'Our warranty only covers the error / part replaced by Kieltec.'
    },
    customers:[], bookings:[], quotes:[], invoices:[], expenses:[], damages:[],
    theme:'auto'
  };
}
let state = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) return {...defaultState(), ...JSON.parse(raw)};}catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('Could not save — storage may be full.'); } }
function nextNo(list){ return (list.reduce((m,r)=>Math.max(m,r.no||0),0))+1; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ n=Number(n||0); return 'R '+n.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function today(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return (d||'').slice(0,7); }
function itemsTotal(items){ return (items||[]).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0); }

/* ---------- theme ---------- */
if(state.theme==='dark'||state.theme==='light') document.documentElement.setAttribute('data-theme', state.theme);
function toggleTheme(){
  const cur=state.theme;
  state.theme = cur==='dark' ? 'light' : (cur==='light' ? 'auto' : 'dark');
  if(state.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
  save(); render();
}

/* ---------- toast ---------- */
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

/* ---------- nav ---------- */
const TABS=[
  ['dashboard','Dashboard','📊'],
  ['bookings','Bookings','🧾'],
  ['quotes','Quotations','📋'],
  ['invoices','Invoices','💳'],
  ['customers','Customers','👤'],
  ['expenses','Expenses','💸'],
  ['damage','Damage reports','⚠️'],
  ['reports','Reports','📈'],
  ['settings','Settings','⚙️']
];
let route = (location.hash||'#dashboard').slice(1);
window.addEventListener('hashchange', ()=>{ route=(location.hash||'#dashboard').slice(1); render(); });

function renderNav(){
  const side=document.getElementById('side');
  side.innerHTML = `<div class="brand"><b>${escapeHtml(state.settings.name)}</b><span>Workshop Manager</span></div>`;
  const list=document.createElement('div');
  TABS.forEach(([id,label,icon])=>{
    const b=document.createElement('button');
    b.className='tab'+(route===id?' active':''); b.innerHTML=`<span>${icon}</span> ${label}`;
    b.onclick=()=>{ location.hash='#'+id; };
    list.appendChild(b);
  });
  side.appendChild(list);
  const themeBtn=document.createElement('button');
  themeBtn.className='themebtn'; themeBtn.style.marginTop='14px'; themeBtn.style.width='100%';
  themeBtn.textContent='Theme: '+(state.theme==='auto'?'Auto':state.theme==='dark'?'Dark':'Light');
  themeBtn.onclick=toggleTheme;
  side.appendChild(themeBtn);

  const m=document.getElementById('mobiletop');
  m.innerHTML='';
  TABS.forEach(([id,label,icon])=>{
    const b=document.createElement('button');
    b.className=(route===id?'active':''); b.textContent=icon+' '+label;
    b.onclick=()=>{ location.hash='#'+id; };
    m.appendChild(b);
  });
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function titleCase(s){ return String(s||'').replace(/(^|[^A-Za-z])([a-z])/g,(m,p,c)=>p+c.toUpperCase()); }
function liveTitleCase(el){
  if(!el) return;
  el.addEventListener('input',()=>{
    const pos=el.selectionStart;
    el.value=titleCase(el.value);
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  });
}

/* ---------- render router ---------- */
function render(){
  renderNav();
  const main=document.getElementById('main');
  main.innerHTML='';
  const map={dashboard:renderDashboard,bookings:()=>renderJobs('bookings'),quotes:()=>renderJobs('quotes'),invoices:()=>renderJobs('invoices'),
    customers:renderCustomers, expenses:renderExpenses, damage:renderDamage, reports:renderReports, settings:renderSettings};
  (map[route]||renderDashboard)(main);
}

/* ---------- dashboard ---------- */
function renderDashboard(main){
  const mk=monthKey(today());
  const incomeThisMonth = state.invoices.filter(i=>monthKey(i.date)===mk).reduce((s,i)=>s+itemsTotal(i.items),0);
  const outstanding = state.invoices.filter(i=>!i.paid).reduce((s,i)=>s+itemsTotal(i.items),0);
  const expensesThisMonth = state.expenses.filter(e=>monthKey(e.date)===mk).reduce((s,e)=>s+Number(e.amount||0),0);
  const openBookings = state.bookings.filter(b=>!b.paid).length;

  main.innerHTML = `
  <header class="top"><div><h1>Dashboard</h1><div style="color:var(--ink-dim);font-size:13px">Overview of the workshop, updated live from your records.</div></div></header>
  <div class="grid stat-grid">
    <div class="stat"><div class="num">${fmt(incomeThisMonth)}</div><div class="lbl">Invoiced this month</div></div>
    <div class="stat"><div class="num">${fmt(outstanding)}</div><div class="lbl">Outstanding (unpaid invoices)</div></div>
    <div class="stat"><div class="num">${fmt(expensesThisMonth)}</div><div class="lbl">Expenses this month</div></div>
    <div class="stat"><div class="num">${openBookings}</div><div class="lbl">Open bookings (unpaid)</div></div>
  </div>
  <div class="card">
    <h3>Recent activity</h3>
    <div class="tablewrap">${recentTable()}</div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="location.hash='#bookings'">New booking</button>
    <button class="btn ghost" onclick="location.hash='#invoices'">New invoice</button>
    <button class="btn ghost" onclick="location.hash='#damage'">New damage report</button>
  </div>`;
}
function recentTable(){
  const rows=[...state.bookings.map(b=>({...b,kind:'Booking'})), ...state.invoices.map(i=>({...i,kind:'Invoice'}))]
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8);
  if(!rows.length) return '<div class="empty">No activity yet — create your first booking or invoice.</div>';
  return `<table><thead><tr><th>Type</th><th>No.</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.kind}</td><td class="mono">#${r.no}</td><td>${escapeHtml(r.customerName)}</td><td>${r.date||''}</td><td class="mono">${fmt(itemsTotal(r.items))}</td>
  <td><span class="badge ${r.paid?'paid':'unpaid'}">${r.paid?'Paid':'Unpaid'}</span></td></tr>`).join('')}
  </tbody></table>`;
}

/* ---------- bookings / invoices (shared) ---------- */
function kindLabel(kind){ return kind==='bookings'?'booking':kind==='quotes'?'quotation':'invoice'; }
function kindTitle(kind){ return kind==='bookings'?'Bookings':kind==='quotes'?'Quotations':'Invoices'; }
function kindHeading(kind){ return kind==='bookings'?'Booking Receipt':kind==='quotes'?'Quotation':'Invoice'; }
function kindBlurb(kind){ return kind==='bookings'?'Intake receipts for devices dropped off for repair.':kind==='quotes'?'Price quotes for proposed work.':'Bills issued for completed work.'; }
function renderJobs(kind){
  const main=document.getElementById('main');
  const list = state[kind];
  const title = kindTitle(kind);
  main.innerHTML = `
  <header class="top"><div><h1>${title}</h1><div style="color:var(--ink-dim);font-size:13px">${kindBlurb(kind)}</div></div>
  <div class="toolbar"><button class="btn ghost" id="importJobBtn">Import CSV</button><button class="btn" id="newJobBtn">New ${kindLabel(kind)}</button></div></header>
  <div class="searchbar"><input id="jobSearch" placeholder="Search by customer or item…"></div>
  <div class="card"><div class="tablewrap" id="jobTable"></div></div>
  <input type="file" id="jobCsvFile" accept=".csv" style="display:none">`;
  document.getElementById('newJobBtn').onclick=()=>openJobForm(kind,null);
  document.getElementById('importJobBtn').onclick=()=>document.getElementById('jobCsvFile').click();
  document.getElementById('jobCsvFile').onchange=(e)=>importJobsCSV(kind,e);
  document.getElementById('jobSearch').oninput=(e)=>drawJobTable(kind, e.target.value);
  drawJobTable(kind,'');
}
function drawJobTable(kind, q){
  q=(q||'').toLowerCase();
  const rows = state[kind].filter(r => !q || r.customerName.toLowerCase().includes(q) || (r.items||[]).some(i=>(i.model||'').toLowerCase().includes(q)))
    .sort((a,b)=> b.no - a.no);
  const el=document.getElementById('jobTable');
  if(!rows.length){ el.innerHTML='<div class="empty">Nothing here yet.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>No.</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="clickable" onclick="openJobForm('${kind}','${r.id}')">
    <td class="mono">#${r.no}</td>
    <td>${escapeHtml(r.customerName)}</td>
    <td>${r.date||''}</td>
    <td>${escapeHtml((r.items||[]).map(i=>i.model).filter(Boolean).join(', ')||'—')}</td>
    <td class="mono">${fmt(itemsTotal(r.items))}</td>
    <td><span class="badge ${r.paid?'paid':'unpaid'}" onclick="event.stopPropagation(); togglePaid('${kind}','${r.id}')">${r.paid?'Paid':'Unpaid'}</span></td>
    <td>
      <button class="rowbtn" title="Edit" onclick="event.stopPropagation(); openJobForm('${kind}','${r.id}')">✏️</button>
      <button class="rowbtn" title="Share" onclick="event.stopPropagation(); shareJob('${kind}','${r.id}')">📤</button>
      <button class="rowbtn" title="Print / Save as PDF" onclick="event.stopPropagation(); printJob('${kind}','${r.id}')">🖨️</button>
      <button class="rowbtn" title="Delete" onclick="event.stopPropagation(); deleteJob('${kind}','${r.id}')">🗑️</button>
    </td>
  </tr>`).join('')}
  </tbody></table>`;
}
function togglePaid(kind,id){ const r=state[kind].find(x=>x.id===id); if(r){ r.paid=!r.paid; save(); drawJobTable(kind, document.getElementById('jobSearch')?.value||''); if(route==='dashboard') render(); } }
function deleteJob(kind,id){ if(!confirm('Delete this record?')) return; state[kind]=state[kind].filter(x=>x.id!==id); save(); drawJobTable(kind,''); }

function openJobForm(kind, id){
  const editing = id ? state[kind].find(x=>x.id===id) : null;
  const rec = editing ? JSON.parse(JSON.stringify(editing)) : {
    id:uid(), no:nextNo(state[kind]), customerName:'', contact:'', email:'', serial:'',
    date: today(), dueDate:'', items:[{model:'',serial:'',error:'',price:0,qty:1}], paid:false, notes:''
  };
  const modalRoot=document.getElementById('modalroot');
  modalRoot.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">
    <button class="closeX" onclick="closeModal()">✕</button>
    <h2>${editing?'Edit':'New'} ${kindLabel(kind)} <span class="mono" style="color:var(--ink-dim);font-size:14px">#${rec.no}</span></h2>
    <div class="form-grid">
      <div class="field"><label>Customer name</label><input id="f_name" list="custList" value="${escapeHtml(rec.customerName)}"></div>
      <datalist id="custList">${state.customers.map(c=>`<option value="${escapeHtml(c.name)}">`).join('')}</datalist>
      <div class="field"><label>Contact no.</label><input id="f_contact" value="${escapeHtml(rec.contact)}"></div>
      <div class="field"><label>Email</label><input id="f_email" value="${escapeHtml(rec.email)}"></div>
      <div class="field"><label>Reference serial (single device)</label><input id="f_serial" value="${escapeHtml(rec.serial)}"></div>
      <div class="field"><label>Date</label><input id="f_date" type="date" value="${rec.date||''}"></div>
      <div class="field"><label>Due date</label><input id="f_due" type="date" value="${rec.dueDate||''}"></div>
    </div>
    <h3 style="margin-top:14px">Items</h3>
    <div id="itemsWrap"></div>
    <button class="btn ghost small" id="addItemBtn" type="button">+ Add item</button>
    <input type="file" id="camInput" accept="image/*" capture="environment" multiple style="display:none">
    <div class="total-line"><span>Total</span><b id="totalDisp" class="mono">${fmt(itemsTotal(rec.items))}</b></div>
    <div class="form-grid wide" style="margin-top:10px">
      <div class="field"><label>Notes</label><textarea id="f_notes" rows="2">${escapeHtml(rec.notes||'')}</textarea></div>
      <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="f_paid" style="width:auto" ${rec.paid?'checked':''}> Paid</label>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn" id="saveJobBtn">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div></div>`;

  function drawItems(){
    const wrap=document.getElementById('itemsWrap');
    wrap.innerHTML = rec.items.map((it,idx)=>`
      <div class="itemblock">
      <div class="itemsrow">
        <div><label>Model</label><input data-i="${idx}" data-f="model" value="${escapeHtml(it.model)}"></div>
        <div><label>Serial no.</label><input data-i="${idx}" data-f="serial" value="${escapeHtml(it.serial)}"></div>
        <div><label>Issue / error</label><input data-i="${idx}" data-f="error" value="${escapeHtml(it.error)}"></div>
        <div><label>Price</label><input data-i="${idx}" data-f="price" type="number" step="0.01" value="${it.price}"></div>
        <div><label>Qty</label><input data-i="${idx}" data-f="qty" type="number" step="1" value="${it.qty}"></div>
        <div><label>Line total</label><input disabled data-lt="${idx}" value="${fmt((it.price||0)*(it.qty||1))}"></div>
        <button class="rowbtn" title="Remove" data-rm="${idx}">✕</button>
      </div>
      <div class="itemphotos">
        ${(it.photos||[]).map((p,pi)=>`<span class="phwrap"><img src="${p}" data-view="${idx}:${pi}" title="View photo"><button class="phrm" data-prm="${idx}:${pi}" title="Remove photo">✕</button></span>`).join('')}
        <button class="btn ghost small" type="button" data-cam="${idx}">📷 Photo</button>
      </div>
      </div>`).join('');
    wrap.querySelectorAll('input[data-f="model"]').forEach(liveTitleCase);
    wrap.querySelectorAll('input[data-i]').forEach(inp=>{
      inp.oninput=()=>{
        const idx=+inp.dataset.i, f=inp.dataset.f;
        rec.items[idx][f] = (f==='price'||f==='qty') ? Number(inp.value) : inp.value;
        const it=rec.items[idx];
        const lt=wrap.querySelector(`input[data-lt="${idx}"]`);
        if(lt) lt.value=fmt((it.price||0)*(it.qty||1));
        document.getElementById('totalDisp').textContent = fmt(itemsTotal(rec.items));
      };
    });
    wrap.querySelectorAll('button[data-rm]').forEach(btn=>{
      btn.onclick=()=>{ rec.items.splice(+btn.dataset.rm,1); if(!rec.items.length) rec.items.push({model:'',serial:'',error:'',price:0,qty:1}); drawItems(); document.getElementById('totalDisp').textContent=fmt(itemsTotal(rec.items)); };
    });
    wrap.querySelectorAll('button[data-cam]').forEach(btn=>{
      btn.onclick=()=>{ pendingCamIdx=+btn.dataset.cam; document.getElementById('camInput').click(); };
    });
    wrap.querySelectorAll('img[data-view]').forEach(img=>{
      img.onclick=()=>{ const [i,p]=img.dataset.view.split(':').map(Number); openLightbox((rec.items[i].photos||[])[p]); };
    });
    wrap.querySelectorAll('button[data-prm]').forEach(btn=>{
      btn.onclick=()=>{ const [i,p]=btn.dataset.prm.split(':').map(Number); (rec.items[i].photos||[]).splice(p,1); drawItems(); };
    });
  }
  let pendingCamIdx=0;
  document.getElementById('camInput').onchange=async (e)=>{
    const files=[...e.target.files];
    for(const f of files){
      const data=await compressImage(f);
      if(!data) continue;
      const it=rec.items[pendingCamIdx]; if(!it) continue;
      (it.photos=it.photos||[]).push(data);
    }
    e.target.value='';
    drawItems();
  };
  drawItems();
  document.getElementById('addItemBtn').onclick=()=>{ rec.items.push({model:'',serial:'',error:'',price:0,qty:1}); drawItems(); };
  liveTitleCase(document.getElementById('f_name'));
  document.getElementById('f_name').oninput=()=>{
    const name=document.getElementById('f_name').value.trim().toLowerCase();
    if(!name) return;
    const booking=[...state.bookings].filter(b=>(b.customerName||'').toLowerCase()===name).sort((a,b)=>b.no-a.no)[0];
    if(booking){
      document.getElementById('f_contact').value=booking.contact||'';
      document.getElementById('f_email').value=booking.email||'';
      document.getElementById('f_serial').value=booking.serial||'';
      if(kind==='invoices'){
        const emptyDefault=rec.items.length===1 && !rec.items[0].model && !rec.items[0].serial && !rec.items[0].error;
        if(emptyDefault && (booking.items||[]).length){ rec.items=JSON.parse(JSON.stringify(booking.items)); drawItems(); }
      }
      document.getElementById('totalDisp').textContent=fmt(itemsTotal(rec.items));
      toast('Details loaded from booking #'+booking.no);
    } else {
      const cust=state.customers.find(c=>(c.name||'').toLowerCase()===name);
      if(cust){ document.getElementById('f_contact').value=cust.contact1||''; document.getElementById('f_email').value=cust.email||''; document.getElementById('f_serial').value=cust.serial||''; }
    }
  };
  document.getElementById('saveJobBtn').onclick=()=>{
    rec.customerName=document.getElementById('f_name').value.trim();
    rec.contact=document.getElementById('f_contact').value.trim();
    rec.email=document.getElementById('f_email').value.trim();
    rec.serial=document.getElementById('f_serial').value.trim();
    rec.date=document.getElementById('f_date').value;
    rec.dueDate=document.getElementById('f_due').value;
    rec.notes=document.getElementById('f_notes').value;
    rec.paid=document.getElementById('f_paid').checked;
    if(!rec.customerName){ toast('Customer name is required'); return; }
    const arr=state[kind];
    const i=arr.findIndex(x=>x.id===rec.id);
    if(i>=0) arr[i]=rec; else arr.push(rec);
    upsertCustomerFromJob(rec);
    save(); closeModal(); render();
  };
}
function upsertCustomerFromJob(rec){
  if(!rec.customerName) return;
  const existing = state.customers.find(c=>c.name.toLowerCase()===rec.customerName.toLowerCase());
  if(existing){ existing.contact1=existing.contact1||rec.contact; existing.email=existing.email||rec.email; existing.serial=existing.serial||rec.serial; }
  else state.customers.push({id:uid(), name:rec.customerName, contact1:rec.contact, contact2:'', email:rec.email, serial:rec.serial, model:(rec.items[0]||{}).model||''});
}
function closeModal(){ document.getElementById('modalroot').innerHTML=''; }

function compressImage(file, maxDim=1200, quality=0.72){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>res(null);
      img.src=fr.result;
    };
    fr.onerror=()=>res(null);
    fr.readAsDataURL(file);
  });
}

/* CSV columns: Customer,Contact,Email,Date,DueDate,Paid,Model,Serial,Error,Price,Qty,Notes */
function parseCSVLine(line){
  const out=[]; let cur=''; let q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function importJobsCSV(kind,e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const lines=reader.result.split(/\r?\n/).filter(l=>l.trim().length);
    let added=0;
    lines.forEach((line,idx)=>{
      const c=parseCSVLine(line);
      if(idx===0 && /customer|name/i.test(c[0])) return;
      if(!c[0]) return;
      const rec={ id:uid(), no:nextNo(state[kind]), customerName:c[0]||'', contact:c[1]||'', email:c[2]||'',
        serial:c[7]||'', date:c[3]||today(), dueDate:c[4]||'',
        items:[{model:c[6]||'', serial:c[7]||'', error:c[8]||'', price:Number(c[9])||0, qty:Number(c[10])||1}],
        paid:/^(yes|y|true|paid|1)$/i.test(c[5]||''), notes:c[11]||'' };
      state[kind].push(rec); upsertCustomerFromJob(rec); added++;
    });
    save(); toast(added+' '+(kindLabel(kind)+'s')+' imported'); render();
  };
  reader.readAsText(file);
  e.target.value='';
}

function renderReports(main){
  const weeks={};

  const months={};
  state.invoices.forEach(i=>{ const mk=monthKey(i.date); if(!mk) return; months[mk]=months[mk]||0; months[mk]+=itemsTotal(i.items); });
  state.expenses.forEach(e=>{ const mk=monthKey(e.date); if(!mk) return; months[mk+'_exp']=(months[mk+'_exp']||0)+Number(e.amount||0); });

  const monthKeys=[...new Set(state.invoices.map(i=>monthKey(i.date)).concat(state.expenses.map(e=>monthKey(e.date))))].filter(Boolean).sort();

  main.innerHTML=`
  <header class="top"><div><h1>Reports</h1><div style="color:var(--ink-dim);font-size:13px">Auto-calculated from your bookings, invoices and expenses.</div></div></header>
  <div class="card"><h3>Monthly income vs. expenses</h3><div class="tablewrap">
  ${monthKeys.length?`<table><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr></thead><tbody>
  ${monthKeys.map(mk=>{ const inc=months[mk]||0; const exp=months[mk+'_exp']||0; return `<tr><td>${mk}</td><td class="mono">${fmt(inc)}</td><td class="mono">${fmt(exp)}</td><td class="mono" style="color:${inc-exp>=0?'var(--good)':'var(--bad)'}">${fmt(inc-exp)}</td></tr>`; }).join('')}
  </tbody></table>`:'<div class="empty">Add invoices and expenses to see monthly reports.</div>'}
  </div></div>
  <div class="card"><h3>Weekly sales (from invoices)</h3><div class="tablewrap">
  ${Object.keys(weeks).length? `<table><thead><tr><th>Week starting</th><th>Invoices</th><th>Total</th></tr></thead><tbody>
  ${Object.entries(weeks).sort((a,b)=>a[0].localeCompare(b[0])).map(([wk,v])=>`<tr><td>${wk}</td><td>${v.count}</td><td class="mono">${fmt(v.income)}</td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">No invoices yet.</div>'}
  </div></div>`;
}
function weekLabel(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr); if(isNaN(d)) return null;
  const day=d.getDay(); const diff=(day===0?-6:1)-day;
  const monday=new Date(d); monday.setDate(d.getDate()+diff);
  return monday.toISOString().slice(0,10);
}

    <div class="field"><label>Registration no.</label><input id="s_reg" value="${escapeHtml(s.reg)}"></div>
    <div class="field" style="grid-column:1/-1"><label>Address line 1</label><input id="s_a1" value="${escapeHtml(s.addr[0]||'')}"></div>
    <div class="field" style="grid-column:1/-1"><label>Address line 2</label><input id="s_a2" value="${escapeHtml(s.addr[1]||'')}"></div>
    <div class="field" style="grid-column:1/-1"><label>Address line 3</label><input id="s_a3" value="${escapeHtml(s.addr[2]||'')}"></div>
    <div class="field"><label>Phone</label><input id="s_phone" value="${escapeHtml(s.phone)}"></div>
    <div class="field"><label>Website</label><input id="s_web" value="${escapeHtml(s.website)}"></div>
    <div class="field"><label>Email</label><input id="s_email" value="${escapeHtml(s.email)}"></div>
    <div class="field"><label>Consultation fee</label><input id="s_fee" type="number" value="${s.consultFee}"></div>
    <div class="field"><label>Bank name</label><input id="s_bank" value="${escapeHtml(s.bankName)}"></div>
    <div class="field"><label>Account type</label><input id="s_acctype" value="${escapeHtml(s.accType)}"></div>
    <div class="field"><label>Account no.</label><input id="s_accno" value="${escapeHtml(s.accNo)}"></div>
    <div class="field"><label>Branch code</label><input id="s_branch" value="${escapeHtml(s.branchCode)}"></div>
    <div class="field" style="grid-column:1/-1"><label>Warranty text</label><textarea id="s_warranty" rows="2">${escapeHtml(s.warrantyText)}</textarea></div>
  </div>
  <div class="toolbar" style="margin-top:16px"><button class="btn" id="saveSettings">Save settings</button></div>
  </div>
  <div class="card">
    <h3>Your data</h3>
    <div style="color:var(--ink-dim);font-size:13px;margin-bottom:10px">Everything is stored only in this browser (localStorage) — nothing is sent anywhere. Back up regularly by exporting.</div>
    <div class="toolbar">
      <button class="btn ghost" id="exportAll">Export full backup (JSON)</button>
      <button class="btn ghost" id="importAllBtn">Import backup</button>
      <button class="btn danger" id="wipeAll">Erase all data</button>
    </div>
    <input type="file" id="allFile" accept=".json" style="display:none">
  </div>`;
  document.getElementById('saveSettings').onclick=()=>{
    s.name=document.getElementById('s_name').value; s.reg=document.getElementById('s_reg').value;
    s.addr=[document.getElementById('s_a1').value, document.getElementById('s_a2').value, document.getElementById('s_a3').value];
    s.phone=document.getElementById('s_phone').value; s.website=document.getElementById('s_web').value; s.email=document.getElementById('s_email').value;
    s.consultFee=Number(document.getElementById('s_fee').value)||0;
    s.bankName=document.getElementById('s_bank').value; s.accType=document.getElementById('s_acctype').value;
    s.accNo=document.getElementById('s_accno').value; s.branchCode=document.getElementById('s_branch').value;
    s.warrantyText=document.getElementById('s_warranty').value;
    save(); toast('Settings saved'); render();
  };
  document.getElementById('exportAll').onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='kieltec_backup_'+today()+'.json'; a.click(); URL.revokeObjectURL(url);
  };
  document.getElementById('importAllBtn').onclick=()=>document.getElementById('allFile').click();
  document.getElementById('allFile').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ const data=JSON.parse(reader.result); state={...defaultState(), ...data}; save(); toast('Backup restored'); render(); }catch(err){ toast('Could not read that file'); } };
    reader.readAsText(file);
  };
  document.getElementById('wipeAll').onclick=()=>{
    if(!confirm('This deletes everything stored in this browser. Export a backup first if you want to keep it. Continue?')) return;
    state=defaultState(); save(); render();
  };
}

render();
</script>
</body>
</html>
